<app-header />

<div class="booking-page">
  <app-booking-stepper [currentStep]="3" />

  <div class="booking-page__layout booking-page__layout--with-sidebar">
    <main class="booking-page__main">
      <h1>{{ 'booking.scheduleSelection.title' | translate }}</h1>

      @if (flashMessage()) {
        <p role="alert" aria-live="polite" class="hold-error">{{ flashMessage() }}</p>
      }

<div class="calendar card">
  <mat-calendar 
    [selected]="selectedDateObj()"
    (selectedChange)="selectDate($event)"
    [minDate]="minDate"
    [maxDate]="maxDate">
  </mat-calendar>
</div>

@if (selectedDate()) {
  <h2>{{ 'booking.scheduleSelection.availableTimes' | translate }}</h2>

  @if (holdError()) {
    <p role="alert" aria-live="polite" class="hold-error">{{ holdError() }}</p>
  }

  <app-async-state-wrapper
    [loading]="slotsLoading()"
    [error]="slotsError()"
    [empty]="!slotsLoading() && !slotsError() && slots().length === 0"
    [emptyMessage]="'booking.scheduleSelection.empty' | translate"
  >
    <div class="slot-grid" role="list" [attr.aria-label]="'booking.scheduleSelection.availableTimesAriaLabel' | translate">
      @for (slot of slots(); track slot) {
        <button type="button" role="listitem" [disabled]="holdSubmitting()" (click)="selectSlot(slot)">
          {{ formatSlotTime(slot) }}
        </button>
      }
    </div>
  </app-async-state-wrapper>
}
    </main>

    <aside class="booking-page__aside">
      <app-booking-sidebar />
    </aside>
  </div>
</div>
