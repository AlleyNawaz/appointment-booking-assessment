<app-header />

<div class="booking-page">
  <div class="booking-entry card">
    <app-async-state-wrapper [loading]="loading()" [error]="error()">
      @if (!loading() && !error()) {
        @if (enabled()) {
          <p>{{ 'booking.entry.redirecting' | translate }}</p>
        } @else {
          <div class="unavailable-state">
            <mat-icon class="unavailable-icon">event_busy</mat-icon>
            <h1 class="unavailable-title">{{ 'booking.entry.unavailableTitle' | translate }}</h1>
            <p class="unavailable-desc">{{ 'booking.entry.unavailableBody' | translate:{ clinicPhoneNumber } }}</p>
          </div>
        }
      }
      <div class="manage-action">
        <button mat-stroked-button color="primary" routerLink="/appointments">
          {{ 'booking.entry.manageExisting' | translate }}
        </button>
      </div>
    </app-async-state-wrapper>
  </div>
</div>
