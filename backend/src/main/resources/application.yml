spring:
  config:
    import: optional:classpath:application-secret.yml
  application:
    name: booking

  mail:
    host: smtp.gmail.com
    port: 587
    username: AliSemanticWeb@gmail.com
    password: ${GMAIL_APP_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:booking_db}?serverTimezone=UTC
    username: ${DB_USERNAME:booking_app}
    password: ${DB_PASSWORD:booking_app_pw}
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Honour X-Forwarded-* headers (client IP, proto, host) so RateLimitingFilter and
  # request logging see the real client address when deployed behind a load balancer
  # or reverse proxy (PRD §14 Scalability). The proxy/LB is trusted infrastructure and
  # is responsible for setting X-Forwarded-For correctly and stripping any client-supplied
  # value before forwarding; this app does not run directly on the public internet.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

booking:
  clinic-timezone: ${CLINIC_TIMEZONE:Asia/Kuala_Lumpur}
  max-booking-window-days: 90
  slot-granularity-minutes: 15
  hold-duration-minutes: 5
  min-lead-time-hours: 24
  cancellation-cutoff-hours: 4
  clinic-phone-number: "+1-555-0100"
  bcrypt-strength: 12
  min-password-length: 12
  max-password-length: 72
  max-failed-login-attempts: 5
  login-lockout-minutes: 15
  session-idle-timeout-minutes: 30
  session-absolute-timeout-hours: 8
  approval-timeout-hours: 24
  missed-marker-grace-hours: 24
  missed-correction-window-days: 7
  availability-rate-limit-per-minute: 10
  booking-rate-limit-per-ten-minutes: 5
  cors:
    allowed-origins:
      - "http://localhost:4200"

